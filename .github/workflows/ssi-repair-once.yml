name: One-time SSI repair

"on":
  push:
    branches: [main]
    paths: [.github/workflows/ssi-repair-once.yml]

permissions:
  contents: write

concurrency:
  group: silverev-ssi-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'FLWind/silverev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Check the reviewed base commit
        run: test "$(git rev-parse HEAD^)" = "d07d7682f340643aada4187f0e5de54a96146970"
      - name: Install Apache for integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2
      - name: Repair SSI and test every page on Apache
        shell: bash
        run: |
          python3 <<'PYTHON'
          from pathlib import Path
          from html.parser import HTMLParser
          import grp
          import os
          import pwd
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          ROOT = Path.cwd().resolve()
          files = [ROOT / os.fsdecode(p) for p in subprocess.check_output(
              ['git', 'ls-files', '-z']).split(b'\0') if p]
          pages = sorted(p for p in files if p.suffix == '.html')
          assert pages and (ROOT / 'includes/header.shtml') in files, 'Unexpected repository layout'
          assert not (ROOT / '.htaccess').exists(), 'Existing .htaccess needs manual review'

          changed = []
          condition_count = 0
          for path in files:
              if path.suffix not in ('.html', '.shtml'):
                  continue
              old = path.read_bytes()
              new = re.sub(rb'<!--#[ \t\r\n]+(?=[A-Za-z])', b'<!--#', old)
              # Modern mod_include uses ap_expr and request-environment variables.
              new, count = re.subn(
                  rb'(<!--#(?:if|elif)\s+expr=")\$section\s*=\s*([a-z0-9_-]+)(")',
                  rb"\1v('section') = '\2'\3", new)
              condition_count += count
              if new != old:
                  path.write_bytes(new)
                  changed.append(path.relative_to(ROOT).as_posix())
              assert not re.search(rb'<!--#\s', new), f'Unnormalized SSI in {path}'
          assert condition_count == 7, f'Expected 7 navigation conditions, found {condition_count}'

          (ROOT / '.htaccess').write_text('''# Apache HTTP Server 2.4 with mod_include; AllowOverride All is required.
          # Process both page files and nested fragments without enabling SSI exec.
          Options +IncludesNOEXEC -Indexes
          AddType text/html .shtml
          AddOutputFilter INCLUDES .html .shtml
          SSILegacyExprParser Off
          DirectoryIndex index.html
          ''', encoding='utf-8')
          print('Changed:', ', '.join(changed), '.htaccess', flush=True)

          SECTIONS = {
              'home': '/', 'news': '/news.html', 'reviews': '/reviews.html',
              'history': '/history.html', 'knowledge': '/knowledge.html',
              'archive': '/archive.html', 'about': '/about.html',
          }
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_nav = False
                  self.links = []
                  self.assets = set()
                  self.headers = 0
                  self.footers = 0
                  self.charset = False
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  classes = (a.get('class') or '').split()
                  if tag == 'nav' and 'main-nav' in classes:
                      self.in_nav = True
                  if tag == 'a' and self.in_nav:
                      self.links.append(a)
                  if tag == 'header' and 'site-header' in classes:
                      self.headers += 1
                  if tag == 'footer' and 'site-footer' in classes:
                      self.footers += 1
                  if tag == 'meta' and (a.get('charset') or '').lower() == 'utf-8':
                      self.charset = True
                  if tag == 'link' and 'stylesheet' in (a.get('rel') or '').split():
                      self.assets.add(a.get('href', ''))
                  if tag in ('script', 'img') and a.get('src'):
                      self.assets.add(a['src'])
              def handle_endtag(self, tag):
                  if tag == 'nav':
                      self.in_nav = False

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          base_url = 'http://127.0.0.1:18080'
          assets = set()
          with tempfile.TemporaryDirectory(prefix='silverev-ssi-') as temp:
              run = Path(temp)
              run.chmod(0o755)
              user = 'www-data' if os.geteuid() == 0 else pwd.getpwuid(os.geteuid()).pw_name
              group = 'www-data' if os.geteuid() == 0 else grp.getgrgid(os.getegid()).gr_name
              conf = run / 'httpd.conf'
              conf.write_text(f'''ServerRoot "{run}"
          ServerName localhost
          Listen 127.0.0.1:18080
          PidFile "{run}/httpd.pid"
          LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
          LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
          LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
          LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
          LoadModule include_module /usr/lib/apache2/modules/mod_include.so
          User {user}
          Group {group}
          ErrorLog "{run}/error.log"
          LogLevel warn
          TypesConfig /etc/mime.types
          DocumentRoot "{ROOT}"
          <Directory "{ROOT}">
              Options None
              AllowOverride All
              Require all granted
          </Directory>
          ''', encoding='utf-8')
              subprocess.run(['/usr/sbin/apache2', '-v'], check=True)
              subprocess.run(['/usr/sbin/apache2', '-t', '-f', str(conf)], check=True)
              server = subprocess.Popen(['/usr/sbin/apache2', '-f', str(conf), '-DFOREGROUND'],
                                        stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              try:
                  for _ in range(100):
                      try:
                          with opener.open(base_url + '/', timeout=2) as response:
                              response.read()
                          break
                      except urllib.error.HTTPError:
                          raise
                      except urllib.error.URLError:
                          if server.poll() is not None:
                              raise RuntimeError(server.stderr.read().decode())
                          time.sleep(0.1)
                  else:
                      raise RuntimeError('Apache startup timed out')

                  routes = [(p, '/' + p.relative_to(ROOT).as_posix()) for p in pages]
                  routes.extend([(ROOT / 'index.html', '/'),
                                 (ROOT / 'index.html', '/index.html?ssi_check=1')])
                  for path, route in routes:
                      with opener.open(base_url + route, timeout=10) as response:
                          assert response.status == 200, (route, response.status)
                          assert response.headers.get_content_type() == 'text/html', route
                          html = response.read().decode('utf-8')
                      assert '[an error occurred while processing this directive]' not in html, route
                      assert '<!--#' not in html, f'Unprocessed SSI in {route}'
                      parsed = Page()
                      parsed.feed(html)
                      assert parsed.headers == parsed.footers == 1, f'Missing/duplicate fragments: {route}'
                      assert parsed.charset, f'head-common missing: {route}'
                      assert '/assets/css/styles.css' in parsed.assets, f'CSS link missing: {route}'
                      assert '/assets/js/site.js' in parsed.assets, f'JS link missing: {route}'
                      hrefs = [a.get('href') for a in parsed.links]
                      assert len(hrefs) == len(SECTIONS) and set(hrefs) == set(SECTIONS.values()), (
                          'Missing/duplicate navigation', route, hrefs)
                      match = re.search(rb'<!--#set\s+var="section"\s+value="([^"]+)"\s*-->',
                                        path.read_bytes())
                      assert match, f'Missing section variable: {route}'
                      section = match[1].decode('utf-8')
                      expected = [SECTIONS[section]] if section in SECTIONS else []
                      active = [a.get('href') for a in parsed.links
                                if 'active' in (a.get('class') or '').split()]
                      current = [a.get('href') for a in parsed.links if a.get('aria-current') == 'page']
                      assert active == current == expected, (route, section, active, current, expected)
                      for asset in parsed.assets:
                          url = urllib.parse.urljoin(base_url + route, asset)
                          if urllib.parse.urlsplit(url).netloc == '127.0.0.1:18080':
                              assets.add(url)
                      print(f'PASS {route}: section={section}, navigation={len(hrefs)}, SSI OK', flush=True)

                  for url in sorted(assets):
                      with opener.open(url, timeout=10) as response:
                          assert response.status == 200, (url, response.status)
                          body = response.read()
                          content_type = response.headers.get_content_type()
                          assert body, f'Empty asset: {url}'
                          if urllib.parse.urlsplit(url).path.endswith('.css'):
                              assert content_type == 'text/css', (url, content_type)
                          if urllib.parse.urlsplit(url).path.endswith('.js'):
                              assert content_type in ('text/javascript', 'application/javascript'), (url, content_type)
                      print(f'PASS asset {url}: {content_type}', flush=True)
                  log = (run / 'error.log').read_text()
                  assert ':error]' not in log, log
                  print(f'ALL PASS: {len(pages)} HTML pages, {len(routes)} page requests, '
                        f'{len(assets)} local assets; no Apache errors', flush=True)
              finally:
                  server.terminate()
                  server.wait(timeout=10)
                  print('APACHE LOG:\n' + (run / 'error.log').read_text(), flush=True)
          PYTHON
      - name: Commit verified fixes and remove this one-time workflow
        shell: bash
        run: |
          git rm -- .github/workflows/ssi-repair-once.yml
          git add -- '*.html' 'includes/*.shtml' .htaccess
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: correct SSI syntax and Apache 2.4 navigation'
          git push origin HEAD:refs/heads/main
          echo "SSI_FIX_COMMIT=$(git rev-parse HEAD)"
